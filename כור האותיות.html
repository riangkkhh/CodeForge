<title>כור האותיות</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&family=Karantina:wght@700&family=Secular+One&display=swap">
<style>
/* פריסה: שולחן עבודה. עמודת בקרות לצד במה גדולה, ובטלפון הבמה עולה למעלה */
:root{
  --bg:#0e0c14;--panel:#16131f;--panel2:#1e1a2a;--line:#2d2740;--fg:#efeaf8;--muted:#9c94b1;
  --accent:#ff6a2b;--accent-fg:#1a0a02;--stage:#0a0910;--chk1:#1b1726;--chk2:#13101b;
  --f-ui:"Rubik","Heebo",system-ui,sans-serif;--f-display:"Karantina","Secular One","Rubik",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f3f0f8;--panel:#ffffff;--panel2:#f0ecf7;--line:#d9d2e6;--fg:#1b1726;--muted:#6b6380;
  --accent:#e5470f;--accent-fg:#ffffff;--stage:#ece8f3;--chk1:#e2dcee;--chk2:#f3f0f8;color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f3f0f8;--panel:#ffffff;--panel2:#f0ecf7;--line:#d9d2e6;--fg:#1b1726;--muted:#6b6380;
  --accent:#e5470f;--accent-fg:#ffffff;--stage:#ece8f3;--chk1:#e2dcee;--chk2:#f3f0f8;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:1320px;margin:0 auto;padding-block:22px 56px;display:grid;gap:22px}
.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 24px}
h1{margin:0;font:700 clamp(46px,8vw,78px)/.9 var(--f-display);letter-spacing:.01em}
.sub{margin:8px 0 0;color:var(--muted);max-width:58ch}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.badges li{font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:99px;color:var(--muted)}
.bench{display:grid;grid-template-columns:minmax(300px,392px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.bench{grid-template-columns:minmax(0,1fr)}.work{order:-1}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px;min-width:0}
.work{display:grid;gap:14px;min-width:0}
label,.lbl{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
textarea,input[type=text],select{width:100%;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit}
textarea{resize:vertical;min-height:66px;font-size:21px;line-height:1.3}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>input{flex:1 1 180px;width:auto}
.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--fg);padding:9px 14px;border-radius:10px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:transparent;font-weight:500}
.btn[disabled]{opacity:.55;cursor:progress}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;cursor:pointer;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--fg)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:26px;font-size:12px;color:var(--muted)}
.tag{padding:2px 9px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--fg)}
.hint{font-size:12px;color:var(--muted);margin:0}
details.grp{border-top:1px solid var(--line);padding-top:10px}
details.grp>summary{cursor:pointer;font-weight:500;list-style:none;display:flex;justify-content:space-between;padding:4px 0}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::after{content:"+";color:var(--muted)}
details.grp[open]>summary::after{content:"−"}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 16px;margin-top:10px}
.ctl{min-width:0;display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 8px}
.ctl label{margin:0}
.ctl output{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ctl input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.colors{display:grid;grid-template-columns:repeat(auto-fit,minmax(68px,1fr));gap:8px;margin-top:10px}
.colors label{font-size:11px;text-align:center;margin-bottom:4px}
.colors input{width:100%;height:36px;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--fg);margin:0}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.seg button{font:inherit;font-size:13px;cursor:pointer;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.stage{position:relative;border-radius:16px;border:1px solid var(--line);min-height:clamp(260px,46vh,540px);display:grid;place-items:center;padding:22px;overflow:hidden;
  background-color:var(--stage);background-image:conic-gradient(var(--chk1) 25%,var(--chk2) 0 50%,var(--chk1) 0 75%,var(--chk2) 0);background-size:24px 24px}
.stage svg{display:block;width:100%;height:auto;max-height:560px;max-width:100%}
.stage.busy::after{content:"מצייר…";position:absolute;top:10px;inset-inline-start:14px;font-size:12px;color:var(--muted)}
.exportbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.exportbar .sz{display:flex;gap:6px;align-items:center;margin-inline-start:auto;font-size:13px;color:var(--muted)}
.exportbar select{width:auto;padding:8px 10px}
.result[hidden]{display:none}
.result{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.result .thumb{width:min(220px,100%);max-height:160px;object-fit:contain;border-radius:8px;
  background-color:var(--stage);background-image:conic-gradient(var(--chk1) 25%,var(--chk2) 0 50%,var(--chk1) 0 75%,var(--chk2) 0);background-size:16px 16px}
.result .meta{display:grid;gap:6px;min-width:0;flex:1 1 220px}
.result .dim{color:var(--muted);font-size:13px;margin:0}
.result textarea{font-size:12px;min-height:90px;direction:ltr;font-family:ui-monospace,monospace}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{font:inherit;font-weight:500;cursor:pointer;padding:9px 18px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.bench[hidden]{display:none}
.pv{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;place-items:center;min-height:200px;min-width:0}
.pv svg{display:block;width:100%;height:auto;max-height:520px;fill:var(--fg)}
.glyphsec h3{font-size:13px;font-weight:500;color:var(--muted);margin:16px 0 8px}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}
.gc{font:inherit;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px}
.gc:hover{border-color:var(--accent)}
.gc svg{display:block;width:100%;height:auto;fill:var(--fg)}
.aip{display:grid;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.aitt{font-weight:700;color:var(--fg);font-size:15px;margin:0}
.aikey{display:grid;gap:10px}
.aikey .row>input{flex:1 1 140px}
.aistat{display:grid;gap:4px;font-size:13px}
.aist{display:flex;align-items:center;gap:8px;color:var(--muted)}
.aist .dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.aist[data-s="run"] .dot{background:var(--accent);animation:pulse 1s infinite}
.aist[data-s="ok"]{color:var(--fg)}.aist[data-s="ok"] .dot{background:#2fb26a}
.aist[data-s="warn"] .dot{background:#e0a21a}.aist[data-s="fail"] .dot{background:#e5484d}
.aierr{color:#e5484d}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.aist[data-s="run"] .dot{animation:none}}
.toast{position:fixed;inset-inline:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin:auto;width:fit-content;max-width:90vw;background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
<div id="app" dir="rtl" lang="he">
  <header class="top">
    <div>
      <h1>כור האותיות</h1>
      <p class="sub">מעצבים גופן משלכם מאפס, בעזרת AI או בעצמכם, ומורידים אותו כקובץ TTF. או כותבים טקסט, מתארים סגנון ומורידים אותיות כ-SVG או PNG.</p>
    </div>
    <ul class="badges" id="badges"></ul>
  </header>
  <nav class="tabs" aria-label="מצבי עבודה"><button type="button" data-tab="fx" aria-pressed="true">אפקטים על טקסט</button><button type="button" data-tab="studio" aria-pressed="false">סטודיו גופן</button></nav>
  <main class="bench" id="fx">
    <section class="panel" aria-label="בקרות">
      <div>
        <label for="txt">הטקסט</label>
        <textarea id="txt" dir="auto" maxlength="80" rows="2" placeholder="מה לכתוב?">הרפתקה</textarea>
      </div>
      <div>
        <label for="prm">תיאור הסגנון</label>
        <div class="row">
          <input type="text" id="prm" dir="auto" autocomplete="off" placeholder="למשל: זהב תלת מימד נצנוצים" value="זהב תלת מימד נצנוצים">
          <button class="btn pri" id="go" type="button">עצבו</button>
          <button class="btn" id="rnd" type="button">הפתעה</button>
        </div>
        <p class="hint" style="margin-top:8px">המנוע מזהה מילים בעברית ובאנגלית: חומרים (זהב, אש, קרח), אפקטים (תלת מימד, ניאון, גליץ'), צורות (קשת, גל, נטוי) וצבעים.</p>
      </div>
      <div class="chips" id="chips"></div>
      <div class="tags" id="tags" aria-live="polite"></div>
      <div id="groups"></div>
    </section>
    <section class="work">
      <div class="stage" id="stage"></div>
      <div class="exportbar">
        <button class="btn pri" id="exPng" type="button">הורד PNG</button>
        <button class="btn" id="exImg" type="button">העתק תמונה</button>
        <button class="btn" id="exSvg" type="button">הורד SVG</button>
        <button class="btn" id="exCopy" type="button">העתק קוד SVG</button>
        <span class="sz"><label for="pngSize" style="margin:0">גודל PNG</label>
          <select id="pngSize"><option value="1024">1024 פיקסלים</option><option value="2048" selected>2048 פיקסלים</option><option value="4096">4096 פיקסלים</option></select></span>
      </div>
      <div class="result" id="result" hidden></div>
    </section>
  </main>
  <main class="bench" id="studio" hidden></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/*PURE-START*/
function hash(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
function rng32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255];}
function rgb2hex(r,g,b){return'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');}
function mix(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);return rgb2hex(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t);}
function hslHex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l);const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return rgb2hex(f(0)*255,f(8)*255,f(4)*255);}
function midColor(st){return st[Math.floor(st.length/2)][1];}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* מעקב קווי מתאר: marching squares עם אינטרפולציה תת-פיקסלית */
function traceMask(data,W,H){
  const v=new Float32Array(W*H);
  for(let i=0,n=W*H;i<n;i++)v[i]=data[i*4+3]/255;
  const idx=new Map(),X=[],Y=[],A1=[],A2=[],t=.5;
  function node(key,px,py){let id=idx.get(key);if(id===undefined){id=X.length;idx.set(key,id);X.push(px);Y.push(py);A1.push(-1);A2.push(-1);}return id;}
  function link(a,b){if(A1[a]<0)A1[a]=b;else A2[a]=b;if(A1[b]<0)A1[b]=a;else A2[b]=a;}
  for(let y=0;y<H-1;y++){for(let x=0;x<W-1;x++){
    const i=y*W+x,va=v[i],vb=v[i+1],vc=v[i+W+1],vd=v[i+W];
    const c=(va>=t?8:0)|(vb>=t?4:0)|(vc>=t?2:0)|(vd>=t?1:0);
    if(c===0||c===15)continue;
    const kT=(y*W+x)*2,kB=((y+1)*W+x)*2,kL=(y*W+x)*2+1,kR=(y*W+x+1)*2+1;
    const T=()=>node(kT,x+(t-va)/(vb-va),y),R=()=>node(kR,x+1,y+(t-vb)/(vc-vb));
    const B=()=>node(kB,x+(t-vd)/(vc-vd),y+1),L=()=>node(kL,x,y+(t-va)/(vd-va));
    switch(c){
      case 1:link(L(),B());break;case 2:link(B(),R());break;case 3:link(L(),R());break;case 4:link(T(),R());break;
      case 5:if((va+vb+vc+vd)/4>=t){link(T(),L());link(B(),R());}else{link(T(),R());link(L(),B());}break;
      case 6:link(T(),B());break;case 7:link(T(),L());break;case 8:link(T(),L());break;case 9:link(T(),B());break;
      case 10:if((va+vb+vc+vd)/4>=t){link(T(),R());link(L(),B());}else{link(T(),L());link(B(),R());}break;
      case 11:link(T(),R());break;case 12:link(L(),R());break;case 13:link(B(),R());break;case 14:link(L(),B());break;
    }
  }}
  const seen=new Uint8Array(X.length),loops=[];
  for(let s=0;s<X.length;s++){
    if(seen[s])continue;
    const loop=[];let prev=-1,cur=s;
    while(cur>=0&&!seen[cur]){seen[cur]=1;loop.push([X[cur],Y[cur],0]);const n=(A1[cur]!==prev)?A1[cur]:A2[cur];prev=cur;cur=n;}
    if(loop.length>=8)loops.push(loop);
  }
  return loops;
}
function dp(p,eps){
  const keep=new Uint8Array(p.length);keep[0]=keep[p.length-1]=1;const st=[[0,p.length-1]];
  while(st.length){const[s,e]=st.pop();let md=0,mi=-1;const x1=p[s][0],y1=p[s][1],dx=p[e][0]-x1,dy=p[e][1]-y1,L=Math.hypot(dx,dy)||1e-9;
    for(let i=s+1;i<e;i++){const d=Math.abs((p[i][0]-x1)*dy-(p[i][1]-y1)*dx)/L;if(d>md){md=d;mi=i;}}
    if(md>eps){keep[mi]=1;st.push([s,mi],[mi,e]);}}
  return p.filter((_,i)=>keep[i]);
}
function simplify(p,eps){
  const n=p.length;if(n<8)return p;let fi=0,fd=-1;
  for(let i=1;i<n;i++){const d=(p[i][0]-p[0][0])**2+(p[i][1]-p[0][1])**2;if(d>fd){fd=d;fi=i;}}
  const a=dp(p.slice(0,fi+1),eps),b=dp(p.slice(fi).concat([p[0]]),eps);
  return a.slice(0,-1).concat(b.slice(0,-1));
}
function markCorners(l,lim){
  const n=l.length;
  for(let i=0;i<n;i++){const a=l[(i+n-1)%n],b=l[i],c=l[(i+1)%n];
    const d1=Math.hypot(b[0]-a[0],b[1]-a[1]),d2=Math.hypot(c[0]-b[0],c[1]-b[1]);
    let d=Math.abs(Math.atan2(c[1]-b[1],c[0]-b[0])-Math.atan2(b[1]-a[1],b[0]-a[0]));if(d>Math.PI)d=2*Math.PI-d;
    b[2]=(d>.75&&Math.max(d1,d2)>lim)?1:0;}
}
function densify(l,maxLen){
  const o=[],n=l.length;
  for(let i=0;i<n;i++){const a=l[i],b=l[(i+1)%n];o.push([a[0],a[1],a[2]]);
    const k=Math.floor(Math.hypot(b[0]-a[0],b[1]-a[1])/maxLen);
    for(let j=1;j<=k;j++){const t=j/(k+1);o.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,0]);}}
  return o;
}
function loopPath(p){
  const n=p.length;if(n<3)return'';const f=v=>Math.round(v*10)/10;
  const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
  const m0=mid(p[n-1],p[0]);let s='M'+f(m0[0])+' '+f(m0[1]);
  for(let i=0;i<n;i++){const m=mid(p[i],p[(i+1)%n]);
    if(p[i][2])s+='L'+f(p[i][0])+' '+f(p[i][1])+'L'+f(m[0])+' '+f(m[1]);
    else s+='Q'+f(p[i][0])+' '+f(p[i][1])+' '+f(m[0])+' '+f(m[1]);}
  return s+'Z';
}
function bboxOf(loops){
  let x0=1e12,y0=1e12,x1=-1e12,y1=-1e12;
  for(const l of loops)for(const p of l){if(p[0]<x0)x0=p[0];if(p[0]>x1)x1=p[0];if(p[1]<y0)y0=p[1];if(p[1]>y1)y1=p[1];}
  return{x:x0,y:y0,w:x1-x0,h:y1-y0};
}

/* גיאומטריה: הטיה ועיוות על הנקודות עצמן, ואז בניית נתיב חלק */
function geometry(base,spec){
  if(base.pixel){
    const k=Math.max(3,Math.round(240/base.FS));let d='',x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;const pts=[];
    for(const r of base.runs){const X=r[0]*k,Y=r[1]*k,Wd=r[2]*k;d+='M'+X+' '+Y+'h'+Wd+'v'+k+'h'+(-Wd)+'z';
      if(X<x0)x0=X;if(X+Wd>x1)x1=X+Wd;if(Y<y0)y0=Y;if(Y+k>y1)y1=Y+k;if(pts.length<500&&(r[0]+r[1])%3===0)pts.push([X,Y]);}
    return{d,bbox:{x:x0,y:y0,w:x1-x0,h:y1-y0},em:base.FS*k,pts,pixel:true,k,lines:base.nLines};
  }
  let loops=base.loops.map(l=>l.map(p=>[p[0],p[1],p[2]]));
  const wt=spec.warpType,A=spec.warpAmt/100,warp=wt!=='none'&&A!==0;
  if(warp)loops=loops.map(l=>densify(l,base.FS*.035));
  const b=bboxOf(loops),cx=b.x+b.w/2,cy=b.y+b.h/2,w=Math.max(b.w,1),h=Math.max(b.h,1);
  const tn=Math.tan(spec.slant*Math.PI/180),Th=A*2.6,R=w/Math.max(Math.abs(Th),1e-6);
  for(const l of loops)for(const p of l){
    let x=p[0],y=p[1];
    if(tn)x+=(cy-y)*tn;
    if(warp){const u=(x-cx)/(w/2);
      if(wt==='arc'){const th=(x-cx)/R;if(Th>0){const r=R+(cy-y);x=cx+r*Math.sin(th);y=cy+R-r*Math.cos(th);}else{const r=R-(cy-y);x=cx+r*Math.sin(th);y=cy-R+r*Math.cos(th);}}
      else if(wt==='wave')y+=h*.3*A*Math.sin((x-cx)/w*Math.PI*2.5);
      else if(wt==='flag')y+=h*.3*A*(.35+.65*(u+1)/2)*Math.sin((x-cx)/w*Math.PI*3.2);
      else if(wt==='bulge')y=cy+(y-cy)*(1+A*.8*(1-u*u));
      else if(wt==='persp')y=cy+(y-cy)*(1+A*.6*u);}
    p[0]=x;p[1]=y;}
  const bb=bboxOf(loops),pts=[],all=[];
  for(const l of loops)for(const p of l)all.push(p);
  const st=Math.max(1,Math.floor(all.length/600));for(let i=0;i<all.length;i+=st)pts.push(all[i]);
  return{d:loops.map(loopPath).join(''),bbox:bb,em:base.FS,pts,pixel:false,lines:base.nLines};
}

const STAR='M0,-1C.08,-.2 .2,-.08 1,0C.2,.08 .08,.2 0,1C-.08,.2 -.2,.08 -1,0C-.2,-.08 -.08,-.2 0,-1Z';
function buildSVG(g,s,opt){
  opt=opt||{};
  const em=g.em,sc=em/260,bb=g.bbox,fx=n=>Math.round(n*100)/100;
  const D=s.depth/100*.32*em,da=(s.depthAngle==null?45:s.depthAngle)*Math.PI/180,dx=Math.cos(da),dy=Math.sin(da),rf=!!s.reflect;
  const ow=s.outlineW*sc,fat=s.fat*sc,gr=s.glowR*sc,neon=!!s.neon,lj=g.pixel?'miter':'round';
  const m=gr*1.7+ow+fat+(s.edgeW||0)*sc+16*sc+s.distort*1.4*sc+(neon?4*sc:0);
  const x0=bb.x-m-Math.max(0,-D*dx),y0=bb.y-m-Math.max(0,-D*dy),x1=bb.x+bb.w+m+Math.max(0,D*dx),y1=bb.y+bb.h+m+Math.max(0,D*dy)+(rf?bb.h*.6:0),VW=x1-x0,VH=y1-y0;
  const rnd=rng32(opt.seed||1);
  const cx=bb.x+bb.w/2,cy=bb.y+bb.h/2,ang=s.angle*Math.PI/180,ux=Math.sin(ang),uy=Math.cos(ang);
  const half=(Math.abs(ux)*bb.w+Math.abs(uy)*bb.h)/2;
  const stops=s.stops.map(a=>'<stop offset="'+a[0]+'" stop-color="'+a[1]+'"/>').join('');
  const fr='filterUnits="userSpaceOnUse" x="'+fx(x0)+'" y="'+fx(y0)+'" width="'+fx(VW)+'" height="'+fx(VH)+'"';
  let defs='<path id="kh-g" d="'+g.d+'" fill-rule="evenodd" clip-rule="evenodd"/>'
    +'<linearGradient id="kh-f" gradientUnits="userSpaceOnUse" x1="'+fx(cx-ux*half)+'" y1="'+fx(cy-uy*half)+'" x2="'+fx(cx+ux*half)+'" y2="'+fx(cy+uy*half)+'">'+stops+'</linearGradient>'
    +'<clipPath id="kh-c"><use xlink:href="#kh-g"/></clipPath>';
  let body='';
  const rect=(fill,extra)=>'<rect x="'+fx(x0)+'" y="'+fx(y0)+'" width="'+fx(VW)+'" height="'+fx(VH)+'" fill="'+fill+'" '+(extra||'')+'/>';
  let bgS='';
  if(s.bg==='dark')bgS+=rect('#0b0912');
  else if(s.bg==='light')bgS+=rect('#f5f2ec');
  else if(s.bg==='solid')bgS+=rect(s.bgC||'#10101a');
  else if(s.bg==='grad'||s.bg==='sunburst'||s.bg==='grid'||s.bg==='dots'||s.bg==='stripes'){
    const c=(neon||s.glowR>0)?s.glowC:midColor(s.stops),G=26*sc;
    defs+='<radialGradient id="kh-bg" cx="50%" cy="46%" r="75%"><stop offset="0" stop-color="'+mix(c,'#000000',.68)+'"/><stop offset="1" stop-color="#07060c"/></radialGradient>';bgS+=rect('url(#kh-bg)');
    if(s.bg==='sunburst'){const n=18,R=Math.hypot(VW,VH);let rays='';
      for(let i=0;i<n;i++){const a0=i*2*Math.PI/n,a1=a0+Math.PI/n;rays+='M'+fx(cx)+' '+fx(cy)+'L'+fx(cx+R*Math.cos(a0))+' '+fx(cy+R*Math.sin(a0))+'L'+fx(cx+R*Math.cos(a1))+' '+fx(cy+R*Math.sin(a1))+'Z';}
      bgS+='<path d="'+rays+'" fill="'+mix(c,'#ffffff',.4)+'" opacity=".16"/>';}
    else if(s.bg==='grid'){defs+='<pattern id="kh-bp" patternUnits="userSpaceOnUse" width="'+fx(G)+'" height="'+fx(G)+'"><path d="M'+fx(G)+' 0H0V'+fx(G)+'" fill="none" stroke="'+mix(c,'#ffffff',.45)+'" stroke-width="'+fx(1.2*sc)+'"/></pattern>';bgS+=rect('url(#kh-bp)','opacity=".3"');}
    else if(s.bg==='dots'){defs+='<pattern id="kh-bp" patternUnits="userSpaceOnUse" width="'+fx(G*.8)+'" height="'+fx(G*.8)+'"><circle cx="'+fx(G*.4)+'" cy="'+fx(G*.4)+'" r="'+fx(G*.11)+'" fill="'+mix(c,'#ffffff',.45)+'"/></pattern>';bgS+=rect('url(#kh-bp)','opacity=".35"');}
    else if(s.bg==='stripes'){defs+='<pattern id="kh-bp" patternUnits="userSpaceOnUse" width="'+fx(G)+'" height="'+fx(G)+'" patternTransform="rotate(-35)"><rect width="'+fx(G*.5)+'" height="'+fx(G)+'" fill="'+mix(c,'#ffffff',.4)+'"/></pattern>';bgS+=rect('url(#kh-bp)','opacity=".09"');}
  }
  if(gr>0){defs+='<filter id="kh-b1" '+fr+'><feGaussianBlur stdDeviation="'+fx(gr)+'"/></filter><filter id="kh-b2" '+fr+'><feGaussianBlur stdDeviation="'+fx(gr*.4)+'"/></filter>';
    const sw=ow*2+fat*2+gr*.5,C=s.glowC,ox=fx(dx*D*.5),oy=fx(dy*D*.5);
    body+='<use xlink:href="#kh-g" x="'+ox+'" y="'+oy+'" fill="'+C+'" stroke="'+C+'" stroke-width="'+fx(sw)+'" stroke-linejoin="round" filter="url(#kh-b1)" opacity=".9"/>'
      +'<use xlink:href="#kh-g" x="'+ox+'" y="'+oy+'" fill="'+C+'" stroke="'+C+'" stroke-width="'+fx(sw*.5)+'" stroke-linejoin="round" filter="url(#kh-b2)" opacity=".75"/>';}
  if(s.shadow){defs+='<filter id="kh-sh" '+fr+'><feGaussianBlur stdDeviation="'+fx(5*sc)+'"/></filter>';
    body+='<use xlink:href="#kh-g" x="'+fx(dx*(D+7*sc))+'" y="'+fx(dy*(D+7*sc))+'" fill="#000" fill-opacity=".5" stroke="#000" stroke-opacity=".5" stroke-width="'+fx(ow*2+fat*2)+'" stroke-linejoin="round" filter="url(#kh-sh)"/>';}
  if(s.distort>0){const bf=.018*260/em;
    defs+='<filter id="kh-dw" '+fr+'><feTurbulence type="fractalNoise" baseFrequency="'+bf.toFixed(4)+' '+(bf*2).toFixed(4)+'" numOctaves="2" seed="'+(hash(String(opt.seed||1))%90+1)+'" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="'+fx(s.distort*2.4*sc)+'" xChannelSelector="R" yChannelSelector="G"/></filter>';}
  body+='<g'+(s.distort>0?' filter="url(#kh-dw)"':'')+'>';
  if((s.edgeW||0)>0&&!neon){const ew=s.edgeW*sc,eN=D>.5?Math.min(60,Math.max(2,Math.ceil(D/3))):0;
    for(let i=eN;i>=0;i--){const t=eN?i/eN:0;body+='<use xlink:href="#kh-g" x="'+fx(dx*D*t)+'" y="'+fx(dy*D*t)+'" fill="'+s.edgeC+'" stroke="'+s.edgeC+'" stroke-width="'+fx(ow*2+fat*2+ew*2+(eN?D/eN*1.7:0))+'" stroke-linejoin="'+lj+'"/>';}}
  if(D>.5){const N=Math.min(90,Math.max(2,Math.ceil(D/(g.pixel?g.k*.5:1.5))));
    for(let i=N;i>=1;i--){const t=i/N,col=mix(s.depthA,s.depthB,t),sw=Math.max(ow*2+fat*2,D/N*1.7);
      body+='<use xlink:href="#kh-g" x="'+fx(dx*D*t)+'" y="'+fx(dy*D*t)+'" fill="'+col+'" stroke="'+col+'" stroke-width="'+fx(sw)+'" stroke-linejoin="'+lj+'"/>';}}
  const ab=(s.aber==null?5:s.aber)*sc;
  if(s.glitch)body+='<use xlink:href="#kh-g" x="'+fx(-ab)+'" fill="#00f0ff" opacity=".85"/><use xlink:href="#kh-g" x="'+fx(ab)+'" fill="#ff0055" opacity=".85"/>';
  if(neon){const c=s.glowC,core=mix(c,'#ffffff',.82);
    body+='<use xlink:href="#kh-g" fill="'+c+'" fill-opacity=".10" stroke="'+c+'" stroke-width="'+fx(5*sc)+'" stroke-linejoin="'+lj+'"/>'
      +'<use xlink:href="#kh-g" fill="none" stroke="'+core+'" stroke-width="'+fx(1.8*sc)+'" stroke-linejoin="'+lj+'"/>';}
  else{
    if(ow>0)body+='<use xlink:href="#kh-g" fill="none" stroke="'+s.outlineC+'" stroke-width="'+fx(ow*2+fat*2)+'" stroke-linejoin="'+lj+'"/>';
    if(!s.hollow)body+='<use xlink:href="#kh-g" fill="url(#kh-f)" stroke="url(#kh-f)" stroke-width="'+fx(fat*2)+'" stroke-linejoin="'+lj+'"/>';
    else if(ow<=0)body+='<use xlink:href="#kh-g" fill="none" stroke="'+midColor(s.stops)+'" stroke-width="'+fx(6*sc)+'" stroke-linejoin="'+lj+'"/>';
    if(!s.hollow){
      if(s.pattern){const PG=Math.max(4,s.patS||16)*sc,pc=s.patC||'#000000',po=(s.patO==null?35:s.patO)/100;let pd='';
        if(s.pattern==='stripes')pd='<pattern id="kh-p" patternUnits="userSpaceOnUse" width="'+fx(PG)+'" height="'+fx(PG)+'" patternTransform="rotate(45)"><rect width="'+fx(PG*.5)+'" height="'+fx(PG)+'" fill="'+pc+'"/></pattern>';
        else if(s.pattern==='dots')pd='<pattern id="kh-p" patternUnits="userSpaceOnUse" width="'+fx(PG)+'" height="'+fx(PG)+'"><circle cx="'+fx(PG/2)+'" cy="'+fx(PG/2)+'" r="'+fx(PG*.24)+'" fill="'+pc+'"/></pattern>';
        else if(s.pattern==='checker')pd='<pattern id="kh-p" patternUnits="userSpaceOnUse" width="'+fx(PG*2)+'" height="'+fx(PG*2)+'"><rect width="'+fx(PG)+'" height="'+fx(PG)+'" fill="'+pc+'"/><rect x="'+fx(PG)+'" y="'+fx(PG)+'" width="'+fx(PG)+'" height="'+fx(PG)+'" fill="'+pc+'"/></pattern>';
        else pd='<pattern id="kh-p" patternUnits="userSpaceOnUse" width="'+fx(PG)+'" height="'+fx(PG)+'"><path d="M0 0H'+fx(PG)+'M0 0V'+fx(PG)+'" fill="none" stroke="'+pc+'" stroke-width="'+fx(PG*.09)+'"/></pattern>';
        defs+=pd;body+=rect('url(#kh-p)','clip-path="url(#kh-c)" opacity="'+po+'"');}
      if(s.inner>0){defs+='<filter id="kh-in" '+fr+'><feGaussianBlur stdDeviation="'+fx(s.inner/100*10*sc)+'"/></filter>';
        body+='<g clip-path="url(#kh-c)"><use xlink:href="#kh-g" fill="none" stroke="#000" stroke-width="'+fx(s.inner/100*30*sc)+'" filter="url(#kh-in)" opacity=".6"/></g>';}
      if(s.dash)body+='<g clip-path="url(#kh-c)"><use xlink:href="#kh-g" fill="none" stroke="#ffffff" stroke-opacity=".85" stroke-width="'+fx(6*sc)+'" stroke-dasharray="'+fx(12*sc)+' '+fx(9*sc)+'" stroke-linejoin="round"/></g>';
      if(s.gloss){defs+='<linearGradient id="kh-gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".65"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>';

        body+='<g clip-path="url(#kh-c)"><use xlink:href="#kh-g" x="'+fx(-1.6*sc)+'" y="'+fx(-1.6*sc)+'" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="'+fx(3*sc)+'"/><use xlink:href="#kh-g" x="'+fx(1.6*sc)+'" y="'+fx(1.6*sc)+'" fill="none" stroke="#000" stroke-opacity=".28" stroke-width="'+fx(3*sc)+'"/>'+gl+'</g>';}
      if(s.scan){const wood=s.scan==='wood',gap=(wood?9:5)*sc,lw=(wood?2:1.6)*sc;
        defs+='<pattern id="kh-l" patternUnits="userSpaceOnUse" width="'+fx(gap)+'" height="'+fx(gap)+'"'+(wood?' patternTransform="rotate(-3)"':'')+'><rect width="'+fx(gap)+'" height="'+fx(lw)+'" fill="'+(wood?'#3a1c08':'#000')+'" opacity="'+(wood?.25:.3)+'"/></pattern>';
        body+=rect('url(#kh-l)','clip-path="url(#kh-c)"');}

    body+='<g clip-path="url(#kh-s'+i+')"><use xlink:href="#kh-g" x="'+fx(ds)+'" fill="'+(neon?s.glowC:'url(#kh-f)')+'"/></g>';}}

      +'<mask id="kh-rm" maskUnits="userSpaceOnUse" x="'+fx(x0)+'" y="'+fx(yR-rh)+'" width="'+fx(VW)+'" height="'+fx(rh)+'"><rect x="'+fx(x0)+'" y="'+fx(yR-rh)+'" width="'+fx(VW)+'" height="'+fx(rh)+'" fill="url(#kh-rg)"/></mask>';

  let size='';if(opt.long){const k=opt.long/Math.max(VW,VH);size=' width="'+Math.round(VW*k)+'" height="'+Math.round(VH*k)+'"';}

  return{svg,vw:VW,vh:VH};
}

function wm(c,w){return w.endsWith('*')?c.startsWith(w.slice(0,-1)):c===w;}

function parsePrompt(prompt){

  found.sort((a,b)=>a.at-b.at);
  const s=JSON.parse(JSON.stringify(BASE));let mat=false;const tags=[];
  for(const f of found)if(f.r.k==='mat'){Object.assign(s,JSON.parse(JSON.stringify(f.r.p)));mat=true;tags.push(f.r.l);}
  for(const f of found)if(f.r.k==='mod'){f.r.f(s);tags.push(f.r.l);}
  let tint=null;for(const t of TINTS){const at=firstHit(toks,t[0]);if(at>=0&&(!tint||at<tint.at))tint={at,c:t[1],n:t[2]};}

function linkFont(f){

  return new Promise(res=>{const l=h('link',{rel:'stylesheet',href:'https://fonts.googleapis.com/css2?family='+f.q+'&display=swap'});
    l.onload=l.onerror=()=>res();document.head.append(l);setTimeout(res,3500);});
}
async function loadFont(f,text){
  await linkFont(f);
  const jobs=[document.fonts.load(f.w+' 100px "'+f.n+'"',text),document.fonts.load('400 100px "Secular One"',text)];
  try{await Promise.race([Promise.all(jobs),sleep(4500)]);}catch(e){}
}
async function getBase(text,sp){
  const key=[text,sp.font,sp.track,sp.pixel,sp.lineH].join('\u0001');
  if(cache.key===key)return cache.val;
  const f=FONTS.find(x=>x.n===sp.font)||FONTS[0];
  await loadFont(f,text);
  const lines=text.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,3);
  const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});
  const rtl=l=>/[֐-ۿ]/.test(l);
  let FS=sp.pixel||260;
  const setF=fs=>{x.font=f.w+' '+fs+'px "'+f.n+'","Secular One",Rubik,Arial,sans-serif';if('letterSpacing' in x)x.letterSpacing=(sp.track*fs/260).toFixed(2)+'px';};
  const widest=()=>Math.max(...lines.map(l=>{x.direction=rtl(l)?'rtl':'ltr';return x.measureText(l).width;}));
  setF(FS);let maxW=widest();
  if(!sp.pixel&&maxW>2400){FS=FS*2400/maxW;setF(FS);maxW=widest();}
  const pad=Math.ceil(FS*.25)+3,lh=FS*(sp.lineH||1.3),W=Math.ceil(maxW+pad*2+FS*.2),H=Math.ceil(lines.length*lh+pad*2);
  c.width=W;c.height=H;setF(FS);
  x.fillStyle='#000';x.textAlign='center';x.textBaseline='alphabetic';
  lines.forEach((l,i)=>{x.direction=rtl(l)?'rtl':'ltr';x.fillText(l,W/2,pad+FS*.98+i*lh);});
  const data=x.getImageData(0,0,W,H).data;let val;
  if(sp.pixel){const runs=[];
    for(let y=0;y<H;y++){let x0=-1;for(let xx=0;xx<=W;xx++){const on=xx<W&&data[(y*W+xx)*4+3]>=128;if(on&&x0<0)x0=xx;else if(!on&&x0>=0){runs.push([x0,y,xx-x0]);x0=-1;}}}
    val={pixel:true,runs,FS,nLines:lines.length};}
  else{const eps=Math.max(.35,.5*FS/260),lim=FS*.05;
    const loops=traceMask(data,W,H).map(l=>simplify(l,eps)).filter(l=>l.length>=3);
    loops.forEach(l=>markCorners(l,lim));
    val={pixel:false,loops,FS,nLines:lines.length};}
  cache={key,val};return val;
}

const fmtSize=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
const slug=()=>(getText().replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-|-$/g,'').slice(0,24)||'text');
const dlP=(window.claude&&window.claude.use)?window.claude.use('downloads').catch(()=>null):Promise.resolve(null);
async function saveFile(blob,name){
  const dl=await dlP;
  if(dl){try{await dl.save({filename:name,data:blob});toast('נשמר: '+name);return;}catch(e){if(e&&e.code==='declined'){toast('השמירה בוטלה');return;}}}
  const u=URL.createObjectURL(blob),a=h('a',{href:u,download:name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);
}
function showResult(kind,blob,name,code){
  if(resUrl)URL.revokeObjectURL(resUrl);resUrl=URL.createObjectURL(blob);result.hidden=false;
  const meta=h('div',{class:'meta'},h('strong',{},name),h('p',{class:'dim'},kind.toUpperCase()+' · '+fmtSize(blob.size)),
    h('p',{class:'dim'},'אם ההורדה לא התחילה, לחצו קליק ימני או לחיצה ארוכה על התמונה ושמרו אותה.'),
    h('div',{class:'row'},h('button',{class:'btn',type:'button',onclick:()=>saveFile(blob,name)},'שמרו שוב')));
  if(code){const ta=h('textarea',{readonly:true,'aria-label':'קוד SVG'});ta.value=code;meta.append(ta);}
  result.replaceChildren(h('img',{class:'thumb',src:resUrl,alt:'תצוגה מקדימה של הקובץ'}),meta);
}
function svgNow(long){if(!cur)return null;return buildSVG(cur.g,cur.s,{seed:cur.seed,long,title:cur.text});}
async function toPng(long){
  const o=svgNow(long),m=o.svg.match(/width="(\d+)" height="(\d+)"/),w=+m[1],hh=+m[2];
  const img=new Image();
  await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(new Error('img'));img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(o.svg);});
  const cv=document.createElement('canvas');cv.width=w;cv.height=hh;cv.getContext('2d').drawImage(img,0,0,w,hh);
  return new Promise(res=>cv.toBlob(res,'image/png'));
}
async function doExport(kind){
  if(!cur){toast('אין עדיין תוצאה לייצוא');return;}
  const btns=['exPng','exImg','exSvg','exCopy'].map($);btns.forEach(b=>b.disabled=true);
  try{
    if(kind==='img'){const size=Math.min(2048,+$('pngSize').value);
      try{if(!(navigator.clipboard&&window.ClipboardItem))throw new Error('noclip');
        await navigator.clipboard.write([new ClipboardItem({'image/png':toPng(size).then(b=>{if(!b)throw new Error('png');return b;})})]);toast('התמונה הועתקה, אפשר להדביק');}
      catch(e){const b=await toPng(size);if(b){showResult('png',b,slug()+'.png');toast('הדפדפן חסם העתקה. לחצו קליק ימני או לחיצה ארוכה על התמונה למטה');}else toast('הייצוא נכשל');}}
    else if(kind==='png'){const b=await toPng(+$('pngSize').value);if(!b)throw new Error('png');const n=slug()+'.png';showResult('png',b,n);await saveFile(b,n);}
    else{const code='<?xml version="1.0" encoding="UTF-8"?>\n'+svgNow(1600).svg;const b=new Blob([code],{type:'image/svg+xml'});
      if(kind==='copy'){try{await navigator.clipboard.writeText(code);toast('קוד ה-SVG הועתק');}catch(e){showResult('svg',b,slug()+'.svg',code);toast('ההעתקה נחסמה, הקוד מוצג למטה');}}
      else{const n=slug()+'.svg';showResult('svg',b,n);await saveFile(b,n);}}
  }catch(e){console.error(e);toast('הייצוא נכשל');}
  finally{btns.forEach(b=>b.disabled=false);}
}

const SPEC_TXT=`GRID: y axis points up. Baseline y=0. Lowercase x-height y=10. Capitals y=14. Hebrew letters sit on y=0 and rise to about y=13 (lamed may rise to y=17). Descenders (and Hebrew final letters ך ן ף ץ ק) drop to y=-4. Glyph width is usually x=0..10 (M and W up to 12, I and i very narrow). Coordinates are plain numbers, one decimal at most.

COMMANDS (uppercase, separated by spaces; independent strokes are separated by " | "):
 M x,y            start a stroke
 L x,y            straight line to
 A cx,cy,rx,ry,a0,a1   elliptical arc, angles in degrees counter-clockwise from +x (y up). It continues from the previous point to the arc end.
 Q cx,cy,x,y      quadratic curve from the current point
 B x1,y1,x2,y2,x,y   cubic bezier from the current point
 Z                close the current stroke
 P x,y x,y x,y ...   FILLED polygon (no pen, 3-40 points): wedges, spikes, blobs, serifs, drips, claws, stencil blocks

 "A": "M0,0 L5,14 L10,0 | M2,5 L8,5"
 "O": "A5.5,7,5,7,0,360"

 "ב": "M1,13 L8,13 L8,0 L0,0"

function validGlyph(ch,s){

  d.st.forEach(st=>st.forEach(eat));d.pl.forEach(pl=>pl.forEach(eat));
  if(x1-x0>26||y1-y0>30||(x1-x0<.3&&y1-y0<.3&&ch!=='.'&&ch!==':'))return null;

function lineOrder(line){

    if(cur&&cur.k===k)cur.s.push(c);else{cur={k,s:[c]};runs.push(cur);}}
  return runs.reverse().flatMap(r=>r.k==='h'?r.s.slice().reverse():r.s);
}

async function makeFontBytes(){
  GL=makeAll(SP);
  return buildTTF(GL,{family:SP.name||'Kor Font',weight:SP.weight,xh:SP.xh});
}
function fileSlug(){return (SP.name||'font').replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-|-$/g,'')||'font';}
async function dlFont(){
  const btn=$('dlTtf');btn.disabled=true;
  try{const bytes=await makeFontBytes(),blob=new Blob([bytes],{type:'font/ttf'}),name=fileSlug()+'.ttf';
    await saveFile(blob,name);}
  catch(e){console.error(e);toast('יצירת הגופן נכשלה');}
  finally{btn.disabled=false;}
}
async function useInFx(){
  const btn=$('useFx');btn.disabled=true;
  try{const bytes=await makeFontBytes(),fam='KorUser'+(++customN),ff=new FontFace(fam,bytes.buffer.slice(0));
    await ff.load();document.fonts.add(ff);
    FONTS.push({n:fam,w:400,l:(SP.name||'הגופן שלי')+(customN>1?' '+customN:''),g:'custom'});
    refreshFontSel();window.__kf=fam;spec.font=fam;syncAll();setTab('fx');schedule();toast('הגופן שלך נטען באפקטים');}
  catch(e){console.error(e);toast('טעינת הגופן נכשלה');}
  finally{btn.disabled=false;}
}
function refreshFontSel(){
  const sel=$('fontSel');if(!sel)return;
  let og=sel.querySelector('optgroup[data-custom]');
  if(!og){og=h('optgroup',{label:'הגופנים שעיצבתם','data-custom':'1'});sel.prepend(og);}
  og.replaceChildren(...FONTS.filter(f=>f.g==='custom').map(f=>h('option',{value:f.n},f.l)));
  sel.value=spec.font;
}
function setTab(t){
  $('fx').hidden=t!=='fx';sStud().hidden=t!=='studio';
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===t)));
  if(t==='studio')schedStudio();
  try{history.replaceState(null,'','#'+t);}catch(e){}
}
function buildStudio(){
  const nameIn=h('input',{type:'text',id:'fName',maxlength:'40',autocomplete:'off'});
  nameIn.addEventListener('input',()=>{SP.name=nameIn.value;});
  STSYNC.push(()=>{nameIn.value=SP.name;});
  const penSeg=h('div',{class:'seg',role:'group','aria-label':'צורת העט'},PENS.map(a=>{const b=h('button',{type:'button','data-pen':a[0]},a[1]);
    b.addEventListener('click',()=>{SP.pen=a[0];syncStudioUI();schedStudio();});return b;}));
  STSYNC.push(()=>penSeg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.pen===SP.pen))));
  const chips=h('div',{class:'chips'},PRESETS.map(p=>{const b=h('button',{class:'chip',type:'button'},p[0]);
    b.addEventListener('click',()=>{Object.assign(SP,p[1]);syncStudioUI();schedStudio();});return b;}));
  const rnd=h('button',{class:'btn',type:'button',id:'stRnd'},'עיצוב אקראי');
  rnd.addEventListener('click',()=>{const R=(a,b)=>a+Math.random()*(b-a);
    Object.assign(SP,{weight:Math.round(R(30,200)),contrast:+R(0,.8).toFixed(2),angle:Math.round(R(-30,40)),pen:PENS[Math.floor(Math.random()*4)][0],width:Math.round(R(75,125)),
      xh:+R(9,11.5).toFixed(1),slant:Math.round(R(-6,16)),sb:Math.round(R(30,90)),rough:Math.random()<.4?+R(.2,1.1).toFixed(2):0,seed:Math.floor(Math.random()*9999)});
    syncStudioUI();schedStudio();});
  const jit=h('button',{class:'btn',type:'button'},'גרסת רעידות אחרת');
  jit.addEventListener('click',()=>{SP.seed++;if(SP.rough<.3)SP.rough=.6;syncStudioUI();schedStudio();});
  const panel=h('section',{class:'panel','aria-label':'עיצוב הגופן'},
    aiPanel(),
    h('div',{},h('label',{for:'fName'},'שם הגופן'),nameIn),
    h('div',{},h('div',{class:'lbl'},'נקודות התחלה'),chips),
    h('div',{class:'row'},rnd,jit),
    h('div',{},h('div',{class:'lbl'},'צורת העט'),penSeg),
    h('div',{class:'grid2'},CTLS.map(c=>stSlider(...c))),
    h('p',{class:'hint'},'כל אות בגופן מצוירת בקו שלד, והעט שאתם מגדירים מושך אותו לקווי מתאר. שינוי אחד בעט משנה את כל האותיות יחד.'));
  const pvBox=h('div',{class:'pv',id:'pvBox'});
  const pvText=h('textarea',{id:'pvText',dir:'auto',rows:'2',maxlength:'160'});pvText.value='אבגדהוז חטיכלמנ\nHello World 2026';
  pvText.addEventListener('input',schedStudio);
  const dl=h('button',{class:'btn pri',type:'button',id:'dlTtf'},'הורד גופן TTF');dl.addEventListener('click',dlFont);
  const use=h('button',{class:'btn',type:'button',id:'useFx'},'עצבו איתו באפקטים');use.addEventListener('click',useInFx);
  const work=h('section',{class:'work'},
    h('div',{},h('label',{for:'pvText'},'כתבו כדי לראות את הגופן'),pvText),pvBox,
    h('div',{class:'exportbar'},dl,use,h('span',{class:'hint',id:'stInfo'})),
    h('p',{class:'hint'},'הקובץ הוא TrueType רגיל שמותקן בוורד, פוטושופ ופיגמה. הקווים חופפים זה לזה, ולשימוש מקצועי כדאי להריץ בעורך גופנים את הפעולה Remove Overlap.'),
    h('div',{id:'glyphGrid'}));
  sStud().replaceChildren(panel,work);
  buildGrid();syncStudioUI();
}
function boot(){
  buildStudio();
  document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
  const fs=$('fontSel');if(fs)fs.addEventListener('change',()=>{const f=FONTS.find(x=>x.n===fs.value);window.__kf=f&&f.g==='custom'?f.n:null;});
  init();
  setTab(location.hash==='#studio'?'studio':'fx');
}
boot();
/*STUDIO-END*/
</script>
