<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">

<title>WordPath – אוצר מילים באנגלית</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--ink:#3c3c3c;--mut:#777;--line:#e5e5e5;--g:#58cc02;--gd:#46a302;--b:#1cb0f6;--r:#ff4b4b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131f24;--card:#1f2c33;--ink:#f1f7fb;--mut:#a5b4bc;--line:#37464f}}
:root[data-theme="dark"]{--bg:#131f24;--card:#1f2c33;--ink:#f1f7fb;--mut:#a5b4bc;--line:#37464f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,"Segoe UI",Arial,sans-serif;min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0px)}
.w{max-width:520px;margin:0 auto;padding:0 16px 120px}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:12px 0;font-weight:800;border-bottom:2px solid var(--line)}
.logo{color:var(--g);font-size:22px;cursor:pointer}

.nd{display:flex;flex-direction:column;align-items:center;margin:14px 0}
.cir{width:78px;height:78px;border-radius:50%;border:0;border-bottom:7px solid;font-size:30px;color:#fff;cursor:pointer;transition:.1s}
.cir:active{transform:translateY(4px);border-bottom-width:3px}
.cir.cu{background:var(--g);border-color:var(--gd);animation:pl 1.6s infinite}.cir.dn{background:#ffc800;border-color:#d9a600}.cir.lk{background:var(--line);border-color:#c9c9c9;cursor:not-allowed}
@keyframes pl{50%{box-shadow:0 0 0 12px rgba(88,204,2,.25)}}
.lb{font-weight:700;margin-top:8px}.stz{color:#ffc800;font-size:14px;height:18px}
.btn,.cta{font:inherit;font-weight:800;border-radius:16px;padding:13px 22px;cursor:pointer;border:2px solid var(--line);border-bottom-width:5px;background:var(--card);color:var(--b)}
.cta{background:var(--g);border-color:var(--gd);color:#fff;font-size:17px;min-width:150px}
.btn:active,.cta:active{transform:translateY(3px);border-bottom-width:2px}
.lt{display:flex;align-items:center;gap:12px;padding:16px 0;font-weight:800}
.x{background:none;border:0;font-size:22px;color:var(--mut);cursor:pointer}
.pg{flex:1;height:16px;background:var(--line);border-radius:9px;overflow:hidden}.pg i{display:block;height:100%;background:var(--g);border-radius:9px;transition:width .4s}
.bd{text-align:center;padding-top:20px}
.hint{color:var(--mut);font-weight:700;margin-bottom:14px}
.en{font-size:42px;font-weight:800;direction:ltr;margin:12px 0}.he{font-size:30px;font-weight:800;margin:12px 0;color:var(--b)}
.spk{width:64px;height:64px;border-radius:50%;border:0;border-bottom:5px solid #1487c2;background:var(--b);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none}
.spk.s{width:40px;height:40px;border-bottom-width:3px}.spk svg{width:26px;height:26px;fill:#fff}.spk.s svg{width:18px;height:18px}
.spk.say{animation:pl2 .5s}@keyframes pl2{50%{transform:scale(1.15)}}
.opts{display:grid;gap:10px;margin-top:22px}
.opt{font:inherit;font-size:19px;font-weight:700;padding:15px;border-radius:16px;border:2px solid var(--line);border-bottom-width:5px;background:var(--card);color:var(--ink);cursor:pointer}
.opt.on{border-color:var(--b);background:#1cb0f620}.opt.good{border-color:var(--g);background:#58cc0225}.opt.bad{border-color:var(--r);background:#ff4b4b25}.opt.gone{visibility:hidden}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:18px}.mt>div{display:grid;gap:10px;align-content:start}
.ti{width:100%;font:inherit;font-size:22px;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin-top:14px;text-align:center}
.ft{position:fixed;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:2px solid var(--line);display:flex;justify-content:center}
.ft .fb{width:100%;max-width:520px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:800}
.ft.g{background:#d7ffb8;color:#3b8c00}.ft.r{background:#ffdfe0;color:#d33}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:8px}.row .en{font-size:20px;flex:1;margin:0}.row .he{font-size:17px;margin:0;color:var(--mut)}
input.s{width:100%;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin:12px 0}
.big{font-size:60px}
</style>
</head>
